<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Quiz - Phone Mockup</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 30% 20%, #1a0533 0%, #0d0d1a 50%, #000 100%);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  position: relative;
}

/* Animated gradient orbs */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  animation: orbFloat 8s ease-in-out infinite alternate;
  pointer-events: none;
}
.orb1 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #a855f7, #6366f1);
  top: -100px; left: -100px;
}
.orb2 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #ec4899, #a855f7);
  bottom: -100px; right: -100px;
  animation-delay: -4s;
}
.orb3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, #06b6d4, #6366f1);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation-delay: -2s;
}

@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, -30px) scale(1.1); }
}

/* Subtle grid overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* Particles */
.particle {
  position: absolute;
  width: 3px; height: 3px;
  background: rgba(168, 85, 247, 0.6);
  border-radius: 50%;
  animation: particleDrift linear infinite;
  pointer-events: none;
}
.particle:nth-child(1) { left: 10%; top: 20%; animation-duration: 12s; animation-delay: 0s; width: 2px; height: 2px; }
.particle:nth-child(2) { left: 20%; top: 60%; animation-duration: 15s; animation-delay: 1s; width: 3px; height: 3px; background: rgba(236, 72, 153, 0.5); }
.particle:nth-child(3) { left: 35%; top: 10%; animation-duration: 10s; animation-delay: 2s; width: 2px; height: 2px; }
.particle:nth-child(4) { left: 50%; top: 70%; animation-duration: 14s; animation-delay: 0.5s; width: 4px; height: 4px; background: rgba(6, 182, 212, 0.4); }
.particle:nth-child(5) { left: 65%; top: 30%; animation-duration: 11s; animation-delay: 3s; width: 2px; height: 2px; }
.particle:nth-child(6) { left: 75%; top: 80%; animation-duration: 13s; animation-delay: 1.5s; width: 3px; height: 3px; }
.particle:nth-child(7) { left: 85%; top: 15%; animation-duration: 16s; animation-delay: 0.2s; width: 2px; height: 2px; background: rgba(168, 85, 247, 0.7); }
.particle:nth-child(8) { left: 45%; top: 50%; animation-duration: 9s; animation-delay: 2.5s; width: 3px; height: 3px; background: rgba(236, 72, 153, 0.4); }
.particle:nth-child(9) { left: 15%; top: 85%; animation-duration: 12s; animation-delay: 4s; width: 2px; height: 2px; }
.particle:nth-child(10) { left: 90%; top: 45%; animation-duration: 14s; animation-delay: 3.5s; width: 3px; height: 3px; background: rgba(6, 182, 212, 0.5); }
.particle:nth-child(11) { left: 5%; top: 40%; animation-duration: 11s; animation-delay: 1.2s; width: 2px; height: 2px; }
.particle:nth-child(12) { left: 55%; top: 90%; animation-duration: 13s; animation-delay: 0.8s; width: 3px; height: 3px; background: rgba(168, 85, 247, 0.5); }

@keyframes particleDrift {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
}

/* Phone container */
.phone-wrapper {
  position: relative;
  z-index: 10;
  animation: phoneFloat 4s ease-in-out infinite;
}

@keyframes phoneFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* Outer glow */
.phone-glow {
  position: absolute;
  top: 50%; left: 50%;
  width: 420px; height: 870px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse, rgba(168,85,247,0.25) 0%, rgba(99,102,241,0.15) 40%, transparent 60%);
  border-radius: 70px;
  filter: blur(40px);
  pointer-events: none;
}

/* iPhone 15 Pro Frame */
.phone-frame {
  position: relative;
  width: 393px;
  height: 852px;
  background: linear-gradient(145deg, #555, #333, #444);
  border-radius: 60px;
  padding: 20px;
  box-shadow:
    0 0 0 2px #222,
    0 0 0 4px #666,
    0 0 0 5px #888,
    0 0 0 6px #333,
    0 30px 80px rgba(0,0,0,0.8),
    0 0 60px rgba(168,85,247,0.3);
  position: relative;
}

/* Side buttons */
.phone-frame::before {
  content: '';
  position: absolute;
  right: -4px;
  top: 180px;
  width: 4px;
  height: 80px;
  background: linear-gradient(to bottom, #888, #666, #888);
  border-radius: 0 2px 2px 0;
  box-shadow: 1px 0 2px rgba(0,0,0,0.3);
}
.phone-frame::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 280px;
  width: 4px;
  height: 55px;
  background: linear-gradient(to bottom, #888, #666, #888);
  border-radius: 0 2px 2px 0;
  box-shadow: 1px 0 2px rgba(0,0,0,0.3);
}

/* Left side buttons */
.left-buttons {
  position: absolute;
  left: -4px;
  top: 200px;
  width: 4px;
  height: 40px;
  background: linear-gradient(to bottom, #888, #666, #888);
  border-radius: 2px 0 0 2px;
  box-shadow: -1px 0 2px rgba(0,0,0,0.3);
}
.left-buttons2 {
  position: absolute;
  left: -4px;
  top: 250px;
  width: 4px;
  height: 60px;
  background: linear-gradient(to bottom, #888, #666, #888);
  border-radius: 2px 0 0 2px;
  box-shadow: -1px 0 2px rgba(0,0,0,0.3);
}
.left-buttons3 {
  position: absolute;
  left: -4px;
  top: 320px;
  width: 4px;
  height: 60px;
  background: linear-gradient(to bottom, #888, #666, #888);
  border-radius: 2px 0 0 2px;
  box-shadow: -1px 0 2px rgba(0,0,0,0.3);
}

/* Dynamic island */
.dynamic-island {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 36px;
  background: #111;
  border-radius: 20px;
  z-index: 20;
  box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
}
.dynamic-island::before {
  content: '';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  background: radial-gradient(circle, #1a3a6b, #0a1a3b);
  border-radius: 50%;
  box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
}

/* Screen */
.phone-screen {
  width: 100%;
  height: 100%;
  background: #000;
  border-radius: 42px;
  overflow: hidden;
  position: relative;
}

.phone-screen iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* Bottom home bar indicator */
.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  z-index: 25;
}

/* Status bar gradient overlay */
.status-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
  z-index: 15;
  pointer-events: none;
}

/* Tagline */
.tagline {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(168, 85, 247, 0.6);
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  z-index: 5;
  text-shadow: 0 0 20px rgba(168,85,247,0.2);
}
.tagline span {
  color: rgba(236, 72, 153, 0.5);
}
</style>
</head>
<body>
  <!-- Animated orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- Particles -->
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>

  <!-- Phone -->
  <div class="phone-wrapper">
    <div class="phone-glow"></div>
    <div class="phone-frame">
      <div class="left-buttons"></div>
      <div class="left-buttons2"></div>
      <div class="left-buttons3"></div>
      <div class="dynamic-island"></div>
      <div class="phone-screen">
        <iframe src="/overlay?mobile=1" title="Anime Quiz Overlay"></iframe>
        <div class="status-overlay"></div>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>

  <div class="tagline">Anime Quiz &bull; <span>Mobile Overlay</span></div>
</body>
</html>
